<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moved — Recursive Rankings</title>
<link rel="canonical" href="https://landfair.github.io/CollegeFootballRankings/ncaam/">
<meta name="robots" content="noindex">
<!-- This section was at /basketball/ until men's and women's basketball were
     split into /ncaam/ and /ncaaw/. GitHub Pages serves no redirect rules, so
     the old path keeps a stub rather than a 404: links and bookmarks handed
     out before the rename still land somewhere real. The hash is carried over
     because the site routes by it (#t=UConn), so a saved team page survives
     the move too. -->
<meta http-equiv="refresh" content="0; url=../ncaam/">
<style>
  body{font:15px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       margin:0;padding:3rem 1rem;background:#fff;color:#111;text-align:center}
  a{color:#0b57d0}
  @media (prefers-color-scheme:dark){body{background:#111;color:#eee}a{color:#8ab4f8}}
</style>
<script>
  /* Keep the hash: the ranking pages route on it, so #t=UConn should survive. */
  location.replace('../ncaam/' + (location.hash || ''));
</script>
</head>
<body>
<p>The basketball section is now split in two.</p>
<p><a href="../ncaam/">NCAAM — men&rsquo;s</a> &middot; <a href="../ncaaw/">NCAAW — women&rsquo;s</a></p>
</body>
</html>
